[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/reset"
  to = "/.netlify/functions/reset"
  status = 200

[[redirects]]
  from = "/models"
  to = "/.netlify/functions/models"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
